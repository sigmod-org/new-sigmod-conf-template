news:
  - "**8 November 2026:** The [SIGMOD 2028 Call for Research Papers](/calls/sigmod-research/) is now available. The first submission deadline is January 17, 2027 (abstracts due January 10, 2027). See [Important Dates](/calls/dates/)."

# Important dates. All deadlines are 23:59 AoE.
# A track either has rounds (one date per round, in order) or a simple list.
# A period is written  "2027-03-16 to 2027-03-23".
important_dates:
  - track: SIGMOD research papers
    page: calls/sigmod-research
    rounds: [Round 1, Round 2, Round 3, Round 4]
    dates:
      Abstract submission & declaration of COIs: [2027-01-10, 2027-04-10, 2027-07-10, 2027-10-10]
      Paper submission:                          [2027-01-17, 2027-04-17, 2027-07-17, 2027-10-17]
      Author feedback phase:                     [2027-03-16 to 2027-03-23, 2027-06-14 to 2027-06-25, 2027-09-13 to 2027-09-20, 2027-12-14 to 2027-12-21]
      Notification of accept/reject/revision:    [2027-04-25, 2027-07-28, 2027-10-23, 2028-01-23]
      Revised paper submission:                  [2027-05-25, 2027-08-27, 2027-11-22, 2028-02-22]
      Final notification of accept/reject:       [2027-06-18, 2027-09-20, 2027-12-16, 2028-03-17]

