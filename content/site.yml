# ─────────────────────────────────────────────────────────────
#  SIGMOD/PODS conference site: settings for one year.
#  Menus follow the 2026 site (2026.sigmod.org): five groups on the
#  left, three on the right. Page text lives in content/pages/*.md.
#  To hide a menu item until it is ready, put  #  in front of its line.
#  A menu item whose page file does not exist yet shows "coming soon".
# ─────────────────────────────────────────────────────────────

conference:
  short_name: SIGMOD/PODS 2028
  year: 2028
  full_name: ACM SIGMOD/PODS International Conference on Management of Data
  dates: June 18–23, 2028
  start: 2028-06-18
  end: 2028-06-23
  location: Seoul, South Korea
  venue: Venue to be announced
  register_link: "#"
  logo: assets/logos/sigmod-pods-oval.svg   # header logo (the footer always shows ACM and SIGMOD/PODS)
  banner: assets/banner.svg   # replace with a photo of the host city, e.g. assets/banner.jpg
  banner_credit: Illustration placeholder for a host-city photo
  accent_color: "#a61e4d"   # one color per year

announcement: "**SIGMOD/PODS 2028** will be held in **Seoul, South Korea**, on June 18–23, 2028. Calls for submissions will be posted here."

