# ─────────────────────────────────────────────────────────────
#  SIGMOD/PODS conference site: settings for one year.
#  Content follows 2028.sigmod.org (as of November 2026).
#  Menus follow the 2026 site: five groups on the left, three on the right.
#  Page text lives in content/pages/*.md.
#  A menu item whose page file does not exist yet appears in gray italics
#  and opens a "coming soon" page. To hide an item, put  #  in front of its line.
# ─────────────────────────────────────────────────────────────

conference:
  short_name: SIGMOD/PODS 2028
  year: 2028
  full_name: ACM SIGMOD/PODS International Conference on Management of Data
  dates: June 17–23, 2028
  start: 2028-06-17
  end: 2028-06-23
  location: Seoul, Korea
  venue: COEX
  register_link: "#"
  logo: assets/logos/sigmod-pods-oval.svg   # header logo (the footer always shows ACM and SIGMOD/PODS)
  banner: assets/banner.jpg
  banner_position: center 72%   # which part of the photo the banner shows
  banner_credit: "Banner photo: Gwanghwamun, Gyeongbokgung Palace © Korea Heritage Service, KOGL Type 1."
  accent_color: "#a61e4d"   # one color per year

announcement: "The **SIGMOD 2028 Call for Research Papers** is now available. The first submission deadline is January 17, 2027 (abstracts due January 10, 2027). [Read the call](/calls/sigmod-research/)"

