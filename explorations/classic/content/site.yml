# ─────────────────────────────────────────────────────────────
#  SIGMOD/PODS conference site — settings for one year.
#  Edit this file to change dates, menus, news and chairs.
#  Page text lives in content/pages/*.md (plain Markdown).
# ─────────────────────────────────────────────────────────────

conference:
  short_name: SIGMOD/PODS 2027
  full_name: ACM SIGMOD/PODS International Conference on Management of Data
  dates: June 13–18, 2027
  start: 2027-06-13
  end: 2027-06-18
  location: Huntington Beach, California, USA
  venue: Hyatt Regency Huntington Beach Resort and Spa
  register_link: "#"
  accent_color: "#0f766e"      # one color per year; everything else stays SIGMOD navy
  banner_caption: Huntington Beach, California

# Shown at the top of every page. Leave empty to hide.
announcement: "The **Call for Tutorial Proposals** is out. Proposals are due December 20, 2026. [Read the call](?p=submit/tutorials)"

# Main menu. Each section lists its pages as  "Title: page-file"  (or a full https:// link).
# A page whose .md file does not exist yet shows "coming soon" automatically.
menu:
  Attend:
    Registration: attend/registration
    Venue & hotel: attend/venue
    Travel & visas: attend/travel
    Student travel grants: attend/grants
    Childcare: attend/childcare
    Code of conduct: attend/code-of-conduct
  Program:
    Program overview: program/overview
    Keynotes: program/keynotes
    Accepted papers: program/papers
    Tutorials: program/tutorials
    Workshops: program/workshops
    Awards: program/awards
  Submit:
    Important dates: submit/dates
    SIGMOD research papers: submit/sigmod-research
    PODS research papers: submit/pods-research
    Industrial track: submit/industrial
    Demonstrations: submit/demos
    Tutorial proposals: submit/tutorials
  Organization:
    Organizers: about/organizers
    Program committees: about/committees
    Sponsors: about/sponsors
    Become a sponsor: about/sponsorship
    Past conferences: https://sigmod.org/sigmod-pods-conferences/

news:
  - "The **Call for Tutorial Proposals** is available. Proposals are due December 20, 2026."
  - "Demonstration track deadlines moved earlier. Submissions are now due **January 11, 2027**. See [Important dates](?p=submit/dates)."
  - "The conference hotel room block is open. See [Venue & hotel](?p=attend/venue)."

# Important dates. All deadlines are 23:59 AoE.
# A track either has rounds (one date per round, in order) or a simple list.
# A period is written  "2026-03-10 to 2026-03-17".
important_dates:
  - track: SIGMOD research papers
    page: submit/sigmod-research
    rounds: [Round 1, Round 2, Round 3, Round 4]
    dates:
      Abstract & COI declaration: [2026-01-10, 2026-04-10, 2026-07-10, 2026-10-10]
      Paper submission:           [2026-01-17, 2026-04-17, 2026-07-17, 2026-10-17]
      Author feedback:            [2026-03-10 to 2026-03-17, 2026-06-10 to 2026-06-17, 2026-09-10 to 2026-09-17, 2026-12-10 to 2026-12-17]
      Accept / reject / revise:   [2026-04-19, 2026-07-19, 2026-10-19, 2027-01-19]
      Revised paper due:          [2026-05-19, 2026-08-19, 2026-11-19, 2027-02-19]
      Final notification:         [2026-06-12, 2026-09-12, 2026-12-12, 2027-03-12]

  - track: PODS research papers
    page: submit/pods-research
    rounds: [Cycle 1, Cycle 2]
    dates:
      Abstract submission:   [2026-05-23, 2026-12-03]
      Full paper submission: [2026-05-30, 2026-12-10]
      Rebuttal:              [2026-07-29 to 2026-08-01, 2027-01-26 to 2027-01-29]
      Initial notification:  [2026-08-11, 2027-02-08]
      Revision due:          [2026-08-25, 2027-02-22]
      Final notification:    [2026-09-01, 2027-03-01]

  - track: Industrial track
    page: submit/industrial
    dates:
      Paper submission: 2026-11-24
      Reviews released: 2027-01-26
      Revision submission: 2027-02-23
      Notification: 2027-03-04
      Camera-ready: 2027-03-18

  - track: Tutorials
    page: submit/tutorials
    dates:
      Proposal submission: 2026-12-20
      Notification: 2027-02-01

  - track: Demonstrations
    page: submit/demos
    dates:
      Submission: 2027-01-11
      COI declaration: 2027-01-12
      Notification: 2027-03-08
      Camera-ready: 2027-04-01

