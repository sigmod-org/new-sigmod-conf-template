# ─────────────────────────────────────────────────────────────
#  SIGMOD/PODS conference site: settings for one year.
#  Menus follow the 2026 site (2026.sigmod.org): five groups on the
#  left, three on the right. Page text lives in content/pages/*.md.
#  To hide a menu item until it is ready, put  #  in front of its line.
# ─────────────────────────────────────────────────────────────

conference:
  short_name: SIGMOD/PODS 2027
  year: 2027
  full_name: ACM SIGMOD/PODS International Conference on Management of Data
  dates: June 13–18, 2027
  start: 2027-06-13
  end: 2027-06-18
  location: Huntington Beach, California, USA
  venue: Hyatt Regency Huntington Beach Resort and Spa
  register_link: "#"
  logo: ../logos/oval-mark.svg   # same file every year
  accent_color: "#0f766e"         # one color per year

announcement: "The **Call for Tutorial Proposals** is out. Proposals are due December 20, 2026. [Read the call](?p=calls/tutorials)"

