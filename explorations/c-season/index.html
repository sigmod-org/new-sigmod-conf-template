<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>{edition} · {city}</title>
</head>
<body data-page="home">
<header class="nav" id="nav"></header>
<main>
  <section class="hero" id="hero"></section>
  <section class="tl-sec" id="timeline" aria-label="Deadline timeline"></section>

  <section class="sec">
    <div class="wrap">
      <div class="sec-head"><div><p class="kicker">Start here</p><h2>What brings you to SIGMOD/PODS?</h2></div></div>
      <div class="paths" id="paths"></div>
    </div>
  </section>

  <section class="sec tint">
    <div class="wrap">
      <div class="sec-head"><div><p class="kicker">Program</p><h2>The week at a glance</h2></div><a class="more" href="#">Detailed schedule →</a></div>
      <div class="days" id="days"></div>
      <p class="samp" id="days-note"></p>
    </div>
  </section>

  <section class="sec">
    <div class="wrap two">
      <div><div class="sec-head"><div><p class="kicker">Latest</p><h2>News</h2></div></div><ul class="feed" id="feed"></ul></div>
      <div><div class="sec-head"><div><p class="kicker">Program</p><h2>Keynotes</h2></div><a class="more" href="#">All keynotes →</a></div><div class="speakers" id="speakers"></div></div>
    </div>
  </section>

  <section class="sec tint">
    <div class="wrap">
      <div class="sec-head"><div><p class="kicker">People</p><h2>Organizers</h2></div><a class="more" href="#">Full committee →</a></div>
      <div class="chairs" id="chairs"></div>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<script src="../shared/content.js"></script><script src="../shared/core.js"></script><script src="../shared/render.js"></script><script src="site.js"></script>
</body>
</html>
